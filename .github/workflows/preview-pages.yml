name: Deploy preview playground

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview bundle
        run: node esbuild.preview.mjs

      - name: Assemble static site
        run: |
          mkdir -p site
          cp src/dev/preview.html site/index.html
          cp src/dev/preview.bundle.js site/
          cp src/dev/preview.bundle.js.map site/
          cp styles.css site/
          # The source page loads styles.css from the repo root (absolute
          # path) for the local `pnpm run dev:preview` server. GitHub Pages
          # serves this project site from a /<repo>/ subpath, so rewrite to
          # a path relative to the flattened site/ directory instead.
          sed -i 's#href="/styles.css"#href="./styles.css"#' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
